[project]
name = "cw-rl-bot"
version = "0.0.1"
description = "Cthulhu Wars RL bot training pipeline (BC + PPO + ONNX)"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "onnx>=1.14",
  "onnxruntime>=1.16",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.5",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.1",
]

[tool.ruff]
line-length = 100
